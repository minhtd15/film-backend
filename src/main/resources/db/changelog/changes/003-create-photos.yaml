databaseChangeLog:
  - changeSet:
      id: 003-create-photos
      author: minhtong
      changes:
        - createTable:
            tableName: photos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: film_roll_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: storage_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: caption
                  type: VARCHAR(255)
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: width
                  type: INT
              - column:
                  name: height
                  type: INT
              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
